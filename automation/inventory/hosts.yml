---
all:
  children:
    exchange_servers:
      hosts:
        exchange_target:
          ansible_host: "{{ lookup('ansible.builtin.env', 'EXCHANGE_HOST') | default('192.168.6.77', true) }}"
      vars:
        ansible_connection: winrm
        ansible_user: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_USER') | default('svc_exchange_auto@exchlab.local', true) }}"
        ansible_password: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_PASSWORD') }}"
        ansible_port: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_PORT') | default('5986', true) }}"
        ansible_winrm_scheme: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_SCHEME') | default('https', true) }}"
        ansible_winrm_transport: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_TRANSPORT') | default('ntlm', true) }}"
        ansible_winrm_server_cert_validation: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_CERT_VALIDATION') | default('ignore', true) }}"
        ansible_winrm_operation_timeout_sec: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_OPERATION_TIMEOUT') | default('60', true) }}"
        ansible_winrm_read_timeout_sec: "{{ lookup('ansible.builtin.env', 'EXCHANGE_WINRM_READ_TIMEOUT') | default('70', true) }}"
